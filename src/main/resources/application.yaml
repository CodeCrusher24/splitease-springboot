spring:
  application:
    name: splitease

  datasource:
    url: jdbc:postgresql://localhost:5433/splitease_java
    username: splitease
    password: splitease
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    property-naming-strategy: SNAKE_CASE

jwt:
  secret: w80XMk1N5PrZJiqbvDQG7VCUumj3eOYnapIxT24RhLWo9Sc6FsgzBEtldfKHAy
  access-token-expiration-minutes: 30

server:
  port: 8080

logging:
  level:
    com.splitease: DEBUG
    org.hibernate.SQL: DEBUG